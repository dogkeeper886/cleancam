<svg xmlns="http://www.w3.org/2000/svg" width="952" height="584" viewBox="0 0 952 584">
  <!-- Source of stream-flow.png: rsvg-convert -z 2 -o stream-flow.png stream-flow.svg -->
  <style>
    text { font-family: 'Liberation Sans', Arial, Helvetica, sans-serif; }
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    .lane-phone { fill: #eef2ff; stroke: #c7d2fe; }
    .lane-pc { fill: #ecfdf5; stroke: #a7f3d0; }
    .lane-label { font-size: 13px; font-weight: 700; }
    .phone { fill: #3730a3; }
    .pc { fill: #065f46; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .key { stroke: #4f46e5; stroke-width: 2.5; }
    .title { font-size: 15px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12.5px; fill: #4b5563; }
    .edge { fill: none; stroke: #334155; stroke-width: 1.6; }
    .alt { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .label { font-size: 12.5px; font-weight: 700; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-alt-back" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="951" height="583" rx="14"/>

  <!-- Lanes -->
  <rect class="lane-phone" x="16" y="16" width="920" height="236" rx="10"/>
  <text class="lane-label phone" x="32" y="38">iPhone</text>
  <rect class="lane-pc" x="16" y="332" width="920" height="236" rx="10"/>
  <text class="lane-label pc" x="32" y="354">Linux PC</text>

  <!-- iPhone rows: video and microphone flow to the PC, the speaker flows back -->
  <rect class="box" x="36" y="52" width="196" height="52" rx="8"/>
  <text class="title" x="134" y="74" text-anchor="middle">Back camera</text>
  <text class="sub" x="134" y="92" text-anchor="middle">raw frames, no overlays</text>

  <rect class="box" x="36" y="116" width="196" height="52" rx="8"/>
  <text class="title" x="134" y="138" text-anchor="middle">Microphone</text>
  <text class="sub" x="134" y="156" text-anchor="middle">echo cancelled, Mute stops it</text>

  <rect class="box" x="36" y="180" width="196" height="52" rx="8"/>
  <text class="title" x="134" y="202" text-anchor="middle">Loudspeaker</text>
  <text class="sub" x="134" y="220" text-anchor="middle">volume buttons set it</text>

  <rect class="box key" x="264" y="52" width="424" height="180" rx="8"/>
  <text class="title" x="476" y="124" text-anchor="middle">CleanCam app</text>
  <text class="sub" x="476" y="146" text-anchor="middle">video: H.264 · 1920x1080 · 20–30 fps · up to 10 Mbps</text>
  <text class="sub" x="476" y="164" text-anchor="middle">microphone: PCM · 48 kHz · mono</text>
  <text class="sub" x="476" y="182" text-anchor="middle">speaker: PCM · 48 kHz · mono</text>

  <rect class="box" x="720" y="52" width="196" height="180" rx="8"/>
  <text class="title" x="818" y="124" text-anchor="middle">Stream server</text>
  <text class="sub" x="818" y="146" text-anchor="middle">TCP 5000: video</text>
  <text class="sub" x="818" y="164" text-anchor="middle">TCP 5001: microphone</text>
  <text class="sub" x="818" y="182" text-anchor="middle">TCP 5002: speaker</text>

  <path class="edge" d="M232,78 H264" marker-end="url(#arrow)"/>
  <path class="edge" d="M232,142 H264" marker-end="url(#arrow)"/>
  <path class="edge" d="M264,206 H232" marker-end="url(#arrow)"/>
  <path class="edge" d="M688,78 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M688,142 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M720,206 H688" marker-end="url(#arrow)"/>

  <!-- Links between the devices, both ways -->
  <path class="edge" d="M818,232 V368" marker-start="url(#arrow-back)" marker-end="url(#arrow)"/>
  <text class="label" x="830" y="304">USB cable</text>
  <path class="alt" d="M748,232 V292 H590 V368" marker-start="url(#arrow-alt-back)" marker-end="url(#arrow-alt)"/>
  <text class="label" x="580" y="318" text-anchor="end">WiFi, by the iPhone's IP</text>

  <!-- Linux PC rows: video and microphone flow right to left, the speaker left to right -->
  <rect class="box" x="720" y="368" width="196" height="180" rx="8"/>
  <text class="title" x="818" y="448" text-anchor="middle">usbmuxd + iproxy</text>
  <text class="sub" x="818" y="470" text-anchor="middle">ports 5000, 5001, 5002</text>
  <text class="sub" x="818" y="488" text-anchor="middle">over USB</text>

  <rect class="box" x="492" y="368" width="196" height="52" rx="8"/>
  <text class="title" x="590" y="390" text-anchor="middle">ffmpeg</text>
  <text class="sub" x="590" y="408" text-anchor="middle">decodes the H.264</text>

  <rect class="box" x="492" y="432" width="196" height="52" rx="8"/>
  <text class="title" x="590" y="454" text-anchor="middle">ffmpeg</text>
  <text class="sub" x="590" y="472" text-anchor="middle">copies the PCM</text>

  <rect class="box" x="492" y="496" width="196" height="52" rx="8"/>
  <text class="title" x="590" y="518" text-anchor="middle">cat</text>
  <text class="sub" x="590" y="536" text-anchor="middle">passes the PCM on</text>

  <rect class="box" x="264" y="368" width="196" height="52" rx="8"/>
  <text class="title" x="362" y="390" text-anchor="middle">v4l2loopback</text>
  <text class="sub" x="362" y="408" text-anchor="middle">/dev/video10 “CleanCam”</text>

  <rect class="box" x="264" y="432" width="196" height="52" rx="8"/>
  <text class="title" x="362" y="454" text-anchor="middle">PipeWire pipe-tunnel</text>
  <text class="sub" x="362" y="472" text-anchor="middle">“CleanCam” microphone</text>

  <rect class="box" x="264" y="496" width="196" height="52" rx="8"/>
  <text class="title" x="362" y="518" text-anchor="middle">PipeWire pipe-tunnel</text>
  <text class="sub" x="362" y="536" text-anchor="middle">“CleanCam” speaker</text>

  <rect class="box" x="36" y="368" width="196" height="180" rx="8"/>
  <text class="title" x="134" y="440" text-anchor="middle">Zoom · OBS · browser</text>
  <text class="sub" x="134" y="462" text-anchor="middle">pick “CleanCam” as the</text>
  <text class="sub" x="134" y="480" text-anchor="middle">camera, microphone</text>
  <text class="sub" x="134" y="498" text-anchor="middle">and speaker</text>

  <path class="edge" d="M720,394 H688" marker-end="url(#arrow)"/>
  <path class="edge" d="M720,458 H688" marker-end="url(#arrow)"/>
  <path class="edge" d="M688,522 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M492,394 H460" marker-end="url(#arrow)"/>
  <path class="edge" d="M492,458 H460" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,522 H492" marker-end="url(#arrow)"/>
  <path class="edge" d="M264,394 H232" marker-end="url(#arrow)"/>
  <path class="edge" d="M264,458 H232" marker-end="url(#arrow)"/>
  <path class="edge" d="M232,522 H264" marker-end="url(#arrow)"/>
</svg>
