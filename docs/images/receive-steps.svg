<svg xmlns="http://www.w3.org/2000/svg" width="952" height="352" viewBox="0 0 952 352">
  <!-- Source of receive-steps.png: rsvg-convert -z 2 -o receive-steps.png receive-steps.svg -->
  <style>
    text { font-family: 'Liberation Sans', Arial, Helvetica, sans-serif; }
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    .lane-phone { fill: #eef2ff; stroke: #c7d2fe; }
    .lane-pc { fill: #ecfdf5; stroke: #a7f3d0; }
    .lane-label { font-size: 13px; font-weight: 700; }
    .phone { fill: #3730a3; }
    .pc { fill: #065f46; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .badge { fill: #4f46e5; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .title { font-size: 15px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12.5px; fill: #4b5563; }
    .edge { fill: none; stroke: #334155; stroke-width: 1.6; }
    .label { font-size: 12.5px; font-weight: 700; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="951" height="351" rx="14"/>

  <!-- Lanes -->
  <rect class="lane-phone" x="16" y="16" width="920" height="120" rx="10"/>
  <text class="lane-label phone" x="32" y="38">iPhone</text>
  <rect class="lane-pc" x="16" y="216" width="920" height="120" rx="10"/>
  <text class="lane-label pc" x="32" y="238">Linux PC</text>

  <!-- 1 -->
  <rect class="box" x="36" y="252" width="196" height="64" rx="8"/>
  <circle class="badge" cx="50" cy="252" r="12"/>
  <text class="num" x="50" y="256.5" text-anchor="middle">1</text>
  <text class="title" x="134" y="280" text-anchor="middle">Start the receiver</text>
  <text class="sub" x="134" y="299" text-anchor="middle">add the iPhone's IP for WiFi</text>

  <!-- 2 -->
  <rect class="box" x="264" y="52" width="196" height="64" rx="8"/>
  <circle class="badge" cx="278" cy="52" r="12"/>
  <text class="num" x="278" y="56.5" text-anchor="middle">2</text>
  <text class="title" x="362" y="80" text-anchor="middle">Open CleanCam</text>
  <text class="sub" x="362" y="99" text-anchor="middle">allow its permission prompts</text>

  <!-- 3 -->
  <rect class="box" x="492" y="252" width="196" height="64" rx="8"/>
  <circle class="badge" cx="506" cy="252" r="12"/>
  <text class="num" x="506" y="256.5" text-anchor="middle">3</text>
  <text class="title" x="590" y="280" text-anchor="middle">Pick “CleanCam”</text>
  <text class="sub" x="590" y="299" text-anchor="middle">as camera, mic and speaker</text>

  <!-- 4 -->
  <rect class="box" x="720" y="52" width="196" height="64" rx="8"/>
  <circle class="badge" cx="734" cy="52" r="12"/>
  <text class="num" x="734" y="56.5" text-anchor="middle">4</text>
  <text class="title" x="818" y="80" text-anchor="middle">Keep CleanCam open</text>
  <text class="sub" x="818" y="99" text-anchor="middle">use Screen off, don't lock</text>

  <path class="edge" d="M232,284 H362 V116" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,84 H590 V252" marker-end="url(#arrow)"/>
  <text class="label" x="600" y="180">status: “Streaming to PC”</text>
  <path class="edge" d="M688,284 H818 V116" marker-end="url(#arrow)"/>
</svg>
