name: CleanCam
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CleanCam:
    type: application
    platform: iOS
    sources: [CleanCam]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dogkeeper886.cleancam
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CleanCam/Info.plist
      properties:
        CFBundleDisplayName: CleanCam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        NSCameraUsageDescription: CleanCam sends the camera picture to your computer.
        NSLocalNetworkUsageDescription: CleanCam sends the camera picture to your computer.
