name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          plutil -p CleanCam/Info.plist

      - name: Build
        run: |
          xcodebuild build \
            -project CleanCam.xcodeproj \
            -scheme CleanCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Unsigned: Impactor (or Xcode) signs it with your Apple ID when installing.
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CleanCam.app Payload/
          zip -qry CleanCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CleanCam-ipa
          path: CleanCam.ipa
