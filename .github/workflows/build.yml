# Builds both unsigned IPAs on each push and pull request: CleanCam.ipa with Xcode on macOS, and CleanCam-legacy.ipa
# for the iPhone 5 with tools/build-legacy.sh on Linux. Publishes both as the release of each v* tag pushed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          plutil -p CleanCam/Info.plist

      - name: Build
        run: |
          xcodebuild build \
            -project CleanCam.xcodeproj \
            -scheme CleanCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Unsigned: Impactor (or Xcode) signs it with your Apple ID when installing.
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CleanCam.app Payload/
          zip -qry CleanCam.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: CleanCam-ipa
          path: CleanCam.ipa

  legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The iOS 11.4 SDK and the theos toolchain that tools/build-legacy.sh downloads at pinned checksums.
      - uses: actions/cache@v6
        with:
          path: build/legacy-tools
          key: legacy-tools-${{ hashFiles('tools/build-legacy.sh') }}

      - run: tools/build-legacy.sh

      # The app must name none of the builder's folders.
      - name: Check the app holds no build paths
        run: |
          if grep -qaF "$PWD" build/legacy/Payload/CleanCam.app/CleanCam; then
            echo "The app holds paths under $PWD." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: CleanCam-legacy-ipa
          path: build/CleanCam-legacy.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, legacy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CleanCam.ipa CleanCam-legacy.ipa -R "$GITHUB_REPOSITORY" \
            --title "CleanCam $GITHUB_REF_NAME" \
            --notes "The unsigned CleanCam apps, built by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA. Sign and install one with a free Apple ID as the README says.

          - **CleanCam.ipa:** for iOS 15 or later, such as the iPhone 7 and X. SHA-256: \`$(sha256sum CleanCam.ipa | cut -d' ' -f1)\`
          - **CleanCam-legacy.ipa:** for 32-bit iPhones on iOS 10, such as the iPhone 5 and 5c. SHA-256: \`$(sha256sum CleanCam-legacy.ipa | cut -d' ' -f1)\`"
